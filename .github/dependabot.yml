version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # eframe 0.36 requires Rust 1.95, while PolyDecomp supports Rust 1.92.
      # Revisit this when the project's declared MSRV is intentionally raised.
      - dependency-name: "eframe"
        update-types:
          - "version-update:semver-major"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
