name: One-time Rust Autofix

on:
  push:
    branches: [builtin-v0.3.0]

permissions:
  contents: write

jobs:
  autofix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: builtin-v0.3.0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Linux GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libwayland-dev libx11-dev pkg-config libssl-dev
      - name: Remove known dead helper
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/engines/mod.rs')
          s = p.read_text()
          old = '''    pub const fn remaining(&self) -> usize {\n        self.data.len().saturating_sub(self.pos)\n    }\n\n'''
          if old in s:
              p.write_text(s.replace(old, ''))
      - name: Apply rustfmt and machine-applicable Clippy fixes
        shell: bash
        run: |
          cargo fmt --all
          cargo clippy --fix --allow-dirty --allow-staged --all-targets --all-features
          cargo fmt --all
      - name: Commit fixes
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No fixes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests
          git commit -m 'style: apply rustfmt and Clippy fixes'
          git push origin HEAD:builtin-v0.3.0
