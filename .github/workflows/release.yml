name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: release-${{ github.repository }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  prepare:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ steps.version.outputs.sha }}
      skip: ${{ steps.version.outputs.skip }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - id: version
        shell: bash
        run: |
          VERSION=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)
          TAG="v${VERSION}"
          SHA='${{ github.event.workflow_run.head_sha }}'
          CURRENT_MAIN=$(gh api "repos/${{ github.repository }}/git/ref/heads/main" --jq '.object.sha')
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

          if [ "$SHA" != "$CURRENT_MAIN" ]; then
            echo "::error::Refusing to release stale CI head $SHA; current main is $CURRENT_MAIN"
            exit 1
          fi

          RELEASE_STATE=$(
            gh api --paginate "repos/${{ github.repository }}/releases" \
              --jq ".[] | select(.tag_name == \"$TAG\") | if .draft then \"draft\" else \"published\" end" \
              | head -n1
          )

          case "$RELEASE_STATE" in
            published)
              echo "skip=true" >> "$GITHUB_OUTPUT"
              ;;
            draft)
              echo "skip=false" >> "$GITHUB_OUTPUT"
              gh release edit "$TAG" --target "$SHA"
              ;;
            "")
              echo "skip=false" >> "$GITHUB_OUTPUT"
              gh release create "$TAG" --target "$SHA" --title "PolyDecomp $TAG" --notes-file RELEASE_NOTES.md --draft
              ;;
            *)
              echo "::error::Unexpected release state for $TAG: $RELEASE_STATE"
              exit 1
              ;;
          esac

  build:
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            asset: polydecomp-windows-x86_64.exe
          - name: Linux x64
            os: ubuntu-latest
            asset: polydecomp-linux-x86_64
          - name: macOS ARM64
            os: macos-14
            asset: polydecomp-macos-aarch64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
      - name: Install Linux GUI build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libwayland-dev libx11-dev pkg-config libssl-dev
      - name: Build release binary
        run: cargo build --release
      - name: Stage Windows asset
        if: runner.os == 'Windows'
        shell: pwsh
        run: Copy-Item target/release/polydecomp.exe '${{ matrix.asset }}'
      - name: Stage Unix asset
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cp target/release/polydecomp '${{ matrix.asset }}'
          chmod +x '${{ matrix.asset }}'
      - name: Upload release asset
        shell: bash
        run: |
          CURRENT_MAIN=$(gh api "repos/${{ github.repository }}/git/ref/heads/main" --jq '.object.sha')
          if [ '${{ needs.prepare.outputs.sha }}' != "$CURRENT_MAIN" ]; then
            echo "::error::Refusing to upload assets from stale release head ${{ needs.prepare.outputs.sha }}; current main is $CURRENT_MAIN"
            exit 1
          fi
          gh release upload '${{ needs.prepare.outputs.tag }}' '${{ matrix.asset }}' --clobber

  publish:
    needs: [prepare, build]
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify release head is still current
        shell: bash
        run: |
          CURRENT_MAIN=$(gh api "repos/${{ github.repository }}/git/ref/heads/main" --jq '.object.sha')
          if [ '${{ needs.prepare.outputs.sha }}' != "$CURRENT_MAIN" ]; then
            echo "::error::Refusing to publish stale release head ${{ needs.prepare.outputs.sha }}; current main is $CURRENT_MAIN"
            exit 1
          fi
      - name: Publish draft release
        run: gh release edit '${{ needs.prepare.outputs.tag }}' --repo '${{ github.repository }}' --draft=false
