name: One-time v0.5 Rust Autofix

on:
  push:
    branches: [native-readable-v0.5.0]

permissions:
  contents: write

jobs:
  autofix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: native-readable-v0.5.0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Linux GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libwayland-dev libx11-dev pkg-config libssl-dev
      - name: Apply rustfmt and machine-applicable Clippy fixes
        shell: bash
        run: |
          cargo fmt --all
          cargo clippy --fix --allow-dirty --allow-staged --all-targets --all-features
          cargo fmt --all
      - name: Commit fixes
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No fixes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests Cargo.toml README.md RELEASE_NOTES.md
          git commit -m 'style: apply rustfmt and Clippy fixes for v0.5'
          git push origin HEAD:native-readable-v0.5.0
