[package]
name = "polydecomp"
version = "0.3.0"
edition = "2024"
rust-version = "1.92"
description = "Self-contained cross-platform multi-format decompiler with a bilingual native GUI"
license = "MIT"
repository = "https://github.com/lasder-ca/PolyDecomp"
readme = "README.md"
keywords = ["decompiler", "reverse-engineering", "bytecode", "disassembler", "gui"]
categories = ["development-tools", "command-line-utilities"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
eframe = "=0.36.1"
rfd = "=0.17.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
object = { version = "0.37", default-features = false, features = ["read", "std", "compression"] }
iced-x86 = { version = "1.21", default-features = false, features = ["std", "decoder", "nasm"] }
wasmprinter = "0.239"
zip = { version = "4", default-features = false, features = ["deflate"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

[dev-dependencies]
tempfile = "3"
