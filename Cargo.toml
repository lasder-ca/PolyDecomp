[package]
name = "polydecomp"
version = "0.2.0"
edition = "2024"
rust-version = "1.92"
description = "Cross-platform multi-format decompiler frontend with a bilingual native GUI"
license = "MIT"
repository = "https://github.com/lasder-ca/PolyDecomp"
readme = "README.md"
keywords = ["decompiler", "reverse-engineering", "ghidra", "bytecode", "gui"]
categories = ["development-tools", "command-line-utilities"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
eframe = "=0.35.0"
rfd = "=0.17.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
